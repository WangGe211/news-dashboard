tml","summary":"9月15日，广元市“营商看基层”第十一期走进剑阁县剑门关镇，12家文旅产业链经营主体现场提诉求，市县镇村四级负责人当场回应施策，为打造翠云廊—剑门关世界级文旅地标注入动能。"},{"title":"四川9月下半月空气质量预报来了：整体优良，首要污染物为O₃和PM2.5","date":"2026-09-15","source":"川观新闻","url":"https://www.toutiao.com/article/7685743883078205971/","summary":"9月15日，四川省生态环境监测总站发布9月下半月空气质量预报：盆地以阴天多云为主、多冷空气伴降水，整体优良；首要污染物为O₃和PM2.5。9月16日盆地大部阴天伴降水以优良为主，21—22日、27—30日受弱冷空气影响有望维持良。"},{"title":"四川华西秋雨上线！14日起雨势持续增强，盆地东北部警惕局部暴雨","date":"2026-09-14","source":"今日头条·中国气象传播者","url":"https://www.toutiao.com/article/7684959477375697437/","summary":"14日起四川迎来持续性华西秋雨，雨区逐步扩大、持续时间长。14日夜起盆地普遍小到中雨，东北部有大雨局部暴雨；15—16日暴雨范围扩至盆地中部。山区地质灾害风险偏高，需防范滑坡、泥石流。"},{"title":"四川新增一所中医药高校！四川中医药职业学院首批近千名新生入学","date":"2026-09-14","source":"腾讯新闻·成都新津","url":"https://news.qq.com/rain/a/20260914A0302800","summary":"9月12日，坐落于成都彭州经开区天府中药城的四川中医药职业学院迎来首批近千名新生，标志着这所省属中医药高职院校正式开启办学。另：成都市设置秋假共3天。"},{"title":"四川最高规格技能大赛决赛在南充开赛 全省2599人报名","date":"2026-09-14","source":"四川日报","url":"https://epaper.scdaily.cn/shtml/scrb/20260914/1089526.html","summary":"9月13—16日，第七届四川工匠杯职业技能大赛暨第四届全国技能大赛四川省选拔赛主赛场决赛在南充举行，设置23个重点赛项，全省2599人报名、1638人进入决赛；四川技能人才总量已达1361万人，高技能人才280万人。"},{"title":"早读四川｜本周日需上班、四川多地9月18日防空警报试鸣、2030年人均预期寿命将达80岁","date":"2026-09-14","source":"四川发布（腾讯新闻）","url":"https://news.qq.com/rain/a/20260914A03OGQ00","summary":"9月14日早读四川：中秋国庆假期9月20日（本周日）需上班；四川成都、绵阳等多地9月18日将开展防空警报试鸣演练；四川卫生健康发展“十五五”规划发布，到2030年人均预期寿命将达80岁；成都博物馆9月30日起展出英国V&A博物馆珍藏威基伍德陶瓷。"},{"title":"真的！下！雪！啦！四川多地加入“下雪群聊”","date":"2026-09-14","source":"四川观察（腾讯新闻）","url":"https://news.qq.com/rain/a/20260914A05MQ900","summary":"受强冷空气影响，四川多地迎来今秋首场降雪：9月14日四姑娘山换上初雪新装；9月11日雪山梁铺厚雪（跨阿坝松潘、绵阳平武）；9月10日阿坝州红原县、达古冰川迎来降雪，川西高原提前入秋雪景模式。"},{"title":"西南地区雨水频繁 华西秋雨“迟到”但累计雨量大","date":"2026-09-13","source":"央视新闻","url":"https://www.toutiao.com/article/7685000535623221770/","summary":"近期华西地区雨水不断，四川西部等地累计雨量大。气象部门表示常年华西秋雨9月2日开启，今年预计偏晚，9月15日之后一波降水范围和持续性有望达标。需关注持续性降雨引发的次生灾害及农业生产影响。"},{"title":"《四川省地质灾害防治“十五五”规划》印发 将避险搬迁不少于1.7万户","date":"2026-09-13","source":"人民网四川","url":"https://sc.people.com.cn/BIG5/n2/2026/0913/c345167-41694598.html","summary":"《四川省地质灾害防治“十五五”规划》印发，明确到2030年底显著提升地灾风险防控能力，“十五五”期间完成避险搬迁不少于1.7万户、治理隐患点不少于1400处，新建不少于1400处自动化监测台站。"},{"title":"遂宁：打造“一极三地” 争当成渝中部崛起“排头兵”","date":"2026-09-12","source":"川观新闻／四川日报","url":"https://www.toutiao.com/article/7684507352086610441/","summary":"9月11日省政府新闻办举行遂宁专场发布会，遂宁提出“十五五”实施“工业倍增”计划，构建“4+11”制造业体系，打造现代产业聚集地、区域物流枢纽承载地、高品质生活宜居地“一极三地”。"},{"title":"“民营企业500家”两张榜单发布 四川多家企业上榜","date":"2026-09-11","source":"腾讯新闻/四川省工商联","url":"https://news.qq.com/rain/a/20260911A04JGO00","summary":"全国工商联发布2026民营企业研发投入500家与发明专利500家榜单，四川6家企业入围研发投入500家、13家跻身发明专利500家，通威、百利天恒、新希望等上榜。"},{"title":"第9个中国农民丰收节9月23日举行 四川夏粮总产量96.8亿斤","date":"2026-09-11","source":"红星新闻/四川省农业农村厅","url":"https://www.163.com/dy/article/L6I00RFN051492T3.html","summary":"9月11日四川省庆丰收活动新闻发布会公布：第9个中国农民丰收节9月23日举行，上半年四川夏粮总产96.8亿斤、增1.5亿斤，大春收获近6成；全省将开展180余场庆丰收活动。"},{"title":"四川高龄津贴标准拟上调：80岁以上老人均可受益","date":"2026-09-11","source":"川观新闻 / 四川省民政厅","url":"https://finance.sina.com.cn/jjxw/2026-09-11/doc-inirkqhk7369134.shtml","summary":"省民政厅就《关于提高80周岁及以上老年人高龄津贴最低标准的通知（征求意见稿）》公开征求意见，拟自2026年10月1日起全省统一上调：80—89周岁由25元/月提至40元，90—99周岁由100元提至120元，100周岁及以上由200元提至300元。征求意见至9月16日。"},{"title":"2026年四川省职工篮球联赛（'工BA'）在蓉开幕","date":"2026-09-11","source":"四川工会/四川观察","url":"https://weibo.com/1905843503/5341877390803795","summary":"9月11日15:00，由省总工会、省体育局、商务厅、文旅厅联合主办的2026年四川省职工篮球联赛在四川省体育馆开幕，系全省首次以'工BA'命名的省级职工篮球赛事，50支代表队参赛。"}],"antiCorruption":[{"title":"四川蜀道城乡投资集团副总经理蒲邦彦主动投案","date":"2026-09-15","source":"廉洁四川/大河财立方","url":"https://www.toutiao.com/article/7685679698268946980/","summary":"四川蜀道城乡投资集团有限责任公司副总经理蒲邦彦涉嫌严重违纪违法，主动投案，正接受省纪委监委驻蜀道集团纪检监察组纪律审查，经省监委指定甘孜州监委管辖并监察调查。"},{"title":"四川蜀道城乡投资集团副总经理蒲邦彦主动投案","date":"2026-09-15","source":"廉洁四川","url":"https://www.scjc.gov.cn/scjc/scdc/2026/9/15/e3e16b1e6d5e47ea951cd4fb82190630.shtml","summary":"四川蜀道城乡投资集团有限责任公司副总经理蒲邦彦涉嫌严重违纪违法，主动投案，正接受四川省纪委监委驻蜀道集团纪检监察组纪律审查，经省监委指定甘孜州监委管辖对其进行监察调查。"},{"title":"四川蜀道物流集团原副董事长黄河主动投案 接受审查调查","date":"2026-09-14","source":"廉洁四川（四川省纪委监委）/ </script>
<script>
(function(){
  function boot(data){
    document.getElementById('updated').textContent = '数据更新时间：' + (data.updatedAt || '—');
    const regions = data.regions || [];
    const intl = data.international || [];

    const regionTabs = document.getElementById('regionTabs');
    const subTabs = document.getElementById('subTabs');
    const list = document.getElementById('list');
    const metaRow = document.getElementById('metaRow');

    const tabs = [];
    regions.forEach((r,i)=>{
      tabs.push({key:r.key, name:r.name, en:'REGION', isIntl:false, idx:i});
    });
    tabs.push({key:'__intl', name:'国际热点', en:'WORLD', isIntl:true, idx:-1});

    let activeKey = tabs[0].key;

    function renderRegionTabs(){
      regionTabs.innerHTML = '';
      tabs.forEach(t=>{
        const el = document.createElement('div');
        el.className = 'tab' + (t.key===activeKey?' active':'');
        el.innerHTML = t.name + '<span class="en">'+t.en+'</span>';
        el.onclick = ()=>{ activeKey = t.key; renderRegionTabs(); renderBody(); };
        regionTabs.appendChild(el);
      });
    }

    function renderBody(){
      const isIntl = activeKey === '__intl';
      subTabs.innerHTML = '';
      if(isIntl){
        subTabs.className = 'subtabs';
        renderList(intl, '国际热点', '');
        return;
      }
      subTabs.className = 'subtabs show';
      const region = regions.find(r=>r.key===activeKey);
      let subs;
      if(region.subs && region.subs.length){  // 安全生产等栏目：使用自定义子栏目（如 国家/四川/绵阳/盐亭 层面）
        subs = region.subs.map(s=>({key:s.key, label:s.label, items:s.items||[], note:s.note||''}));
      } else {
        subs = [];
        if(region.key !== 'aba'){  // 阿坝州已设“反腐被查”独立栏目，不再单列“阳光阿坝”官方动态
          subs.push({key:'official', label:region.officialLabel || '官方动态', items:region.official, note:''});
        }
        subs.push(
          {key:'appointments', label:'干部任免', items:region.appointments, note:''},
          {key:'antiCorruption', label:'反腐被查', items:region.antiCorruption || [], note:region.acNote || ''},
          {key:'hot', label:'热点信息', items:region.hot, note:''}
        );
      }
      let activeSub = subs[0].key;
      subs.forEach(s=>{
        const el = document.createElement('div');
        el.className = 'subtab' + (s.key===activeSub?' active':'');
        el.textContent = s.label + ' ('+ (s.items? s.items.length:0) +')';
        el.onclick = ()=>{
          [...subTabs.children].forEach(c=>c.className='subtab');
          el.className='subtab active';
          renderList(s.items, s.label, s.note);
        };
        subTabs.appendChild(el);
      });
      renderList(subs[0].items, subs[0].label, subs[0].note);
    }

    function renderList(items, label, note){
      list.innerHTML = '';
      const arr = (items||[]).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')); // 时间从近到远
      metaRow.innerHTML = '当前栏目：' + escapeHtml(label) + '　共 ' + arr.length + ' 条'
        + (note ? '　<span class="acnote">权威发布：' + escapeHtml(note) + '</span>' : '');
      if(arr.length===0){
        list.innerHTML = '<div class="empty">暂无资讯</div>';
        return;
      }
      arr.forEach(it=>{
        const card = document.createElement('div');
        card.className = 'card';
        const titleHtml = it.url
          ? '<a href="'+it.url+'" target="_blank" rel="noopener">'+escapeHtml(it.title)+'</a>'
          : escapeHtml(it.title);
        card.innerHTML =
          '<h3>'+titleHtml+'</h3>'+
          '<div class="meta"><span class="tag">'+escapeHtml(label)+'</span>'+
          '<span class="src">'+escapeHtml(it.date||'')+'　·　'+escapeHtml(it.source||'')+'</span></div>'+
          '<p class="summary">'+escapeHtml(it.summary||'')+'</p>';
        list.appendChild(card);
      });
    }

    function escapeHtml(s){
      return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    renderRegionTabs();
    renderBody();
  }

  // 在线打开时拉取最新 data.json（绕过缓存，确保“打开即最新”）；本地双击若被浏览器拦截则回退内嵌数据
  fetch('./data.json?t=' + Date.now(), {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('bad'); return r.json(); })
    .then(d=>boot(d))
    .catch(()=>boot(NEWS_DATA));
})();
</script>
</body>
