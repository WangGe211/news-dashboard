111cf632fe36e71","summary":"9月19日凌晨，四川攀枝花市盐边县格萨拉乡支六河村石家沟隧道附近突发泥石流，初步统计5人失联。自然资源部地质勘查管理司启动地质灾害防御Ⅳ级响应，四川省地质灾害防治指挥部启动省级三级应急响应，多方力量开展抢险搜救。"},{"title":"国务院办公厅印发《关于进一步加强烟花爆竹全链条安全监管的意见》","date":"2026-09-17","source":"中国政府网","url":"https://www.gov.cn/yaowen/liebiao/202609/content_7081360.htm","summary":"国务院办公厅出台意见，对烟花爆竹生产、经营、运输、燃放、销毁处置各环节实施全链条安全监管，压实地方属地与部门监管责任，防范重特大事故。"},{"title":"国家防总针对四川启动防汛四级应急响应 四川三警齐发","date":"2026-09-16","source":"腾讯新闻·国家防总/四川省气象台","url":"https://news.qq.com/rain/a/20250916A08XCQ00","summary":"国家防总决定9月16日16时针对山东、四川启动防汛四级应急响应，派出工作组赴四川协助指导秋雨防范。四川发布暴雨黄色预警，9月16日20时至17日20时巴中、南充、绵阳、成都等多地暴雨，局部大暴雨；山洪灾害黄色预警（9地可能性较大）+蓝色预警（含绵阳盐亭、三台、梓潼等40县）。"},{"title":"陕西省安委办部署中秋国庆前安全生产专家指导帮扶工作","date":"2026-09-16","source":"应急管理部","url":"https://www.mem.gov.cn/xw/gdyj/202609/t20260916_716695.shtml","summary":"9月14日，陕西省安委办召开9月份安全生产专家指导帮扶工作动员会，部署中秋国庆双节前安全防范。要求各指导帮扶组聚焦防风险、除隐患、保安全，紧盯交通运输、消防、文化旅游、建设施工、矿山、危化等重点领域开展预防性排查，以体检式帮扶发现问题、督促整改。"},{"title":"应急管理部：《应急时刻》将播出安全生产打非治违特别节目","date":"2026-09-16","source":"应急管理部","url":"https://www.mem.gov.cn/xw/yjglbgzdt/202609/t20260916_716679.shtml","summary":"9月16日中午11:50，央视社会与法频道《应急时刻》播出安全生产打非治违特别节目。国务院安委会办公室联合中央政法委、最高法、最高检、公安部、司法部，部署聚焦矿山、化工、消防、工贸等重点行业领域深入开展安全生产打非治违工作，报道山东多部门联合查处化工非法生产窝点。"},{"title":"江苏部署推进船舶修造领域安全防范工作","date":"2026-09-15","source":"应急管理部","url":"https://www.mem.gov.cn/xw/gdyj/202609/t20260915_716203.shtml","summary":"9月11日江苏召开全省视频会议，部署推进船舶修造领域风险隐患排查整治和中秋国庆假期安全防范，要求加强动火作业管理、外包队伍管控及疏散逃生演练。"},{"title":"新一轮暗访启动！国务院安委办将于9月和10月开展两轮暗访","date":"2026-09-15","source":"搜狐","url":"https://www.sohu.com/a/1076001554_121106869","summary":"国务院安委办联合交通运输部、农业农村部部署9月、10月两轮全国性安全生产全覆盖暗访督查，覆盖31省区市，严格执行“四不两直”，聚焦重大隐患清零与责任落实。"},{"title":"国务院对青岛北海造船“9·10”重大火灾事故提级调查","date":"2026-09-15","source":"人民日报 / 人民网","url":"https://cpc.people.com.cn/BIG5/n1/2026/0915/c64387-40798848.html","summary":"9月10日青岛北海造船一艘外籍货轮维修期间火灾致25死5伤，国务院成立事故调查组提级调查，由应急管理部牵头，彻查原因、严肃追责，举一反三抓好重点行业隐患排查。"},{"title":"国家防减救灾委、应急管理部针对海南严重暴雨灾害启动国家自然灾害救助四级应急响应","date":"2026-09-15","source":"应急管理部/环球网","url":"https://www.huanqiu.com/article/4TDacbHXfKP","summary":"9月15日,国家防减救灾委、应急管理部针对近期强降雨对海南造成的严重灾害影响,启动国家自然灾害救助四级应急响应,派出工作组赶赴灾区;截至9月14日18时海南已转移危险区域群众5.5万余人。"},{"title":"应急管理部:加强造修船、建筑施工、化工等行业外包业务安全监管","date":"2026-09-15","source":"应急管理部/央视新闻","url":"https://wap.cj.sina.cn/7x24/5095588","summary":"9月15日,应急管理部召开会议部署近期重点工作,强调深刻汲取事故教训,加强中央企业安全监管,加强造修船、建筑施工、化工等行业外包业务安全监管,狠抓矿山安全\"八条硬措施\"硬落实,强化烟花爆竹及危化、工贸、交通运输监管,严格落实临灾预警\"叫应\"机制,防范遏制重特大事故。"},{"title":"应急管理部召开党委会议 研究部署中秋国庆假期及近期安全生产重点工作","date":"2026-09-15","source":"中华人民共和国应急管理部","url":"https://www.mem.gov.cn/xw/yjyw/202609/t20260915_716664.shtml","summary":"9月15日，应急管理部召开党委会议，传达学习习近平总书记关于安全生产重要指示批示精神，落实国务院常务会议要求，部署近期重点工作：紧盯重点行业领域排查整治，加强中央企业及造修船、建筑施工、化工外包业务安全监管；深化人员密集场所消防、矿山八条硬措施、危化工贸交通等监管；强化汛情会商与临灾预警“叫应”，严防群死群伤。"},{"title":"两部门对海南启动国家自然灾害救助四级应急响应","date":"2026-09-15","source":"人民网·应急管理部","url":"https://society.people.com.cn/n1/2026/0915/c1008-40799159.html","summary":"9月15日，国家防减救灾委、应急管理部针对近期强降雨对海南造成的严重灾害影响，启动国家自然灾害救助四级应急响应，派出工作组赶赴灾区指导救助工作。"},{"title":"应急管理部部署加强造修船、建筑施工、化工等行业外包业务安全监管","date":"2026-09-15","source":"央视新闻 / 每日经济新闻","url":"https://www.mrjjxw.com/articles/2026-09-15/4582470.html","summary":"9月15日，应急管理部召开会议部署近期重点工作，要求深刻汲取事故教训，加强中央企业安全监管，重点加强造修船、建筑施工、化工等行业外包业务安全监管，层层拧紧责任链条；中秋国庆临近，深化消防、矿山、危化、工贸、交通运输等领域隐患整治。"},{"title":"收藏这份安全生产实用手册（有限空间/隧道施工/工贸火灾）","date":"2026-09-14","source":"新华社（今日头条）","url":"https://www.toutiao.com/article/7685313703658504742/","summary":"结合国务院安委办通报与应急管理部部署，梳理有限空间作业、隧道施工、工贸火灾等重点风险防范要点，超80%有限空间死亡事故存在盲目施救导致伤亡扩大。"},{"title":"4项矿山安全强制性国家标准发布","date":"2026-09-14","source":"国家市场监督管理总局","url":"https://www.samr.gov.cn/xw/zj/art/2026/art_cafe2c1de93d47f3812e888968968565.html","summary":"市场监管总局（国家标准委）批准发布一批重要国家标准，其中在安全生产方面发布井工煤矿机电设备、地下矿山动力电池及隐蔽致灾因素普查等5项矿山安全领域强制性国家标准，2027年3月1日起实施。"},{"title":"海南五指山遭遇历史罕见特大暴雨 全市启动“五停一关”","date":"2026-09-14","source":"中国新闻网","url":"https://www.toutiao.com/article/7685301829713936942/","summary":"9月14日，海南五指山市24小时累积降雨量达616.2毫米，破1958年有记录以来最大纪录，7时30分将防汛防风应急响应提升至Ⅰ级，全市实行停课停工停业停产停运、关停旅游景区“五停一关”。"},{"title":"各地各部门贯彻落实习近平总书记重要指示 坚决守牢安全发展底线","date":"2026-09-12","source":"光明网（新华社）","url":"https://news.gmw.cn/2026-09/12/content_38997337.htm","summary":"深刻汲取青岛北海造船厂货轮火灾等事故教训，各地系统剖析安全生产薄弱环节，压紧压实防范举措，聚焦工贸、危化品、建筑施工等重点领域举一反三排查整治，守牢安全底线。"},{"title":"国务院安委办部署切实做好中秋国庆假期和第四季度安全生产工作","date":"2026-09-12","source":"应急管理部","url":"https://www.mem.gov.cn/xw/yjglbgzdt/202509/t20250912_557688.shtml","summary":"国务院安委办印发通知，部署各地区、各有关部门和中央企业深刻汲取事故教训，坚决遏制建筑施工事故，全力防控公共安全风险，强化重点行业领域安全监管，做好中秋国庆假期和第四季度安全生产。"},{"title":"李强主持召开国务院常务会议 对加强安全生产工作作出进一步部署","date":"2026-09-12","source":"中国政府网 / 新华社","url":"https://www.gov.cn/yaowen/liebiao/202609/content_7080787.htm","summary":"国务院总理李强9月11日主持召开国务院常务会议，对加强安全生产工作作出进一步部署，要求举一反三、压紧压实安全生产责任，紧盯重点行业领域深入排查整治风险隐患，严肃追责问责，坚决遏制重特大事故发生。"},{"title":"国家防总针对海南启动防汛四级应急响应","date":"2026-09-12","source":"中国网（应急管理部消息）","url":"https://news.china.com.cn/2026-09/12/content_118692962.shtml","summary":"受南海热带低压影响，9月13日至15日海南岛等地有大到暴雨、局地大暴雨，山洪地质灾害、中小河流洪水及城市内涝风险高。根据《国家防汛抗旱应急预案》，国家防总于9月12日19时针对海南启动防汛四级应急响应。"}]},{"key":"sichuan","label":"四川省","items":[{"title":"四川启动地质灾害三级应急响应 盐边县石家沟隧道附近突发泥石流","date":"2026-09-19","source":"新华网 / 网易","url":"https://www.163.com/dy/article/L76PQH2F0514R9OJ.html","summary":"19日凌晨，四川省攀枝花市盐边县格萨拉乡支六河村石家沟隧道附近突发泥石流。四川省地质灾害防治指挥部启动省级地质灾害三级应急响应，省自然资源厅调度攀枝花市、盐边县开展应急处置并派出专家工作组赶赴现场。"},{"title":"省安办通报煤矿安全生产形势：今年以来发生煤矿事故22起、死亡32人","date":"2026-09-17","source":"四川省国防科工办 / 省安办","url":"https://www.scjg.gov.cn/news/3180.html","summary":"省安办、应急管理厅通报今年以来全省煤矿生产安全事故形势：共发生煤矿生产安全事故22起、死亡32人，其中较大事故3起、死亡12人。指出三点趋势——国有煤矿事故伤亡惨重（百万吨死亡率1.18%，为全国均值12.7倍）、事故区域集中（泸州宜宾广元攀枝花占82%/88%）、非法违法行为屡禁不止（80%重点产煤区域矿存在未经批准采掘工作面），要求坚决遏制煤矿事故多发势头。"},{"title":"四川局发布2026年第六批煤矿典型执法案例（串联通风/甲烷传感器/探放水）","date":"2026-09-16","source":"国家矿山安全监察局四川局 / 腾讯新闻","url":"https://new.qq.com/rain/a/20260916A0C8HS00","summary":"国家矿山安全监察局四川局公布2026年第六批煤矿典型执法案例，含违规实施串联通风、未按规定安设甲烷传感器、未按规定进行探放水3起案例，均责令停产整顿并处罚款，以案为鉴督促煤矿落实安全生产主体责任、增强依法办矿管矿意识。"},{"title":"四川通报邻水县中山煤矿“隐蔽工作面”重大违法案件","date":"2026-09-14", <script>
(function(){
  function boot(data){
    document.getElementById('updated').textContent = '数据更新时间：' + (data.updatedAt || '—');
    const regions = data.regions || [];
    const intl = data.international || [];

    const regionTabs = document.getElementById('regionTabs');
    const subTabs = document.getElementById('subTabs');
    const list = document.getElementById('list');
    const metaRow = document.getElementById('metaRow');

    const tabs = [];
    regions.forEach((r,i)=>{
      tabs.push({key:r.key, name:r.name, en:'REGION', isIntl:false, idx:i});
    });
    tabs.push({key:'__intl', name:'国际热点', en:'WORLD', isIntl:true, idx:-1});

    let activeKey = tabs[0].key;

    function renderRegionTabs(){
      regionTabs.innerHTML = '';
      tabs.forEach(t=>{
        const el = document.createElement('div');
        el.className = 'tab' + (t.key===activeKey?' active':'');
        el.innerHTML = t.name + '<span class="en">'+t.en+'</span>';
        el.onclick = ()=>{ activeKey = t.key; renderRegionTabs(); renderBody(); };
        regionTabs.appendChild(el);
      });
    }

    function renderBody(){
      const isIntl = activeKey === '__intl';
      subTabs.innerHTML = '';
      if(isIntl){
        subTabs.className = 'subtabs';
        renderList(intl, '国际热点', '');
        return;
      }
      subTabs.className = 'subtabs show';
      const region = regions.find(r=>r.key===activeKey);
      let subs;
      if(region.subs && region.subs.length){  // 安全生产等栏目：使用自定义子栏目（如 国家/四川/绵阳/盐亭 层面）
        subs = region.subs.map(s=>({key:s.key, label:s.label, items:s.items||[], note:s.note||''}));
      } else {
        subs = [];
        if(region.key !== 'aba'){  // 阿坝州已设“反腐被查”独立栏目，不再单列“阳光阿坝”官方动态
          subs.push({key:'official', label:region.officialLabel || '官方动态', items:region.official, note:''});
        }
        subs.push(
          {key:'appointments', label:'干部任免', items:region.appointments, note:''},
          {key:'antiCorruption', label:'反腐被查', items:region.antiCorruption || [], note:region.acNote || ''},
          {key:'hot', label:'热点信息', items:region.hot, note:''}
        );
      }
      let activeSub = subs[0].key;
      subs.forEach(s=>{
        const el = document.createElement('div');
        el.className = 'subtab' + (s.key===activeSub?' active':'');
        el.textContent = s.label + ' ('+ (s.items? s.items.length:0) +')';
        el.onclick = ()=>{
          [...subTabs.children].forEach(c=>c.className='subtab');
          el.className='subtab active';
          renderList(s.items, s.label, s.note);
        };
        subTabs.appendChild(el);
      });
      renderList(subs[0].items, subs[0].label, subs[0].note);
    }

    function renderList(items, label, note){
      list.innerHTML = '';
      const arr = (items||[]).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')); // 时间从近到远
      metaRow.innerHTML = '当前栏目：' + escapeHtml(label) + '　共 ' + arr.length + ' 条'
        + (note ? '　<span class="acnote">权威发布：' + escapeHtml(note) + '</span>' : '');
      if(arr.length===0){
        list.innerHTML = '<div class="empty">暂无资讯</div>';
        return;
      }
      arr.forEach(it=>{
        const card = document.createElement('div');
        card.className = 'card';
        const titleHtml = it.url
          ? '<a href="'+it.url+'" target="_blank" rel="noopener">'+escapeHtml(it.title)+'</a>'
          : escapeHtml(it.title);
        card.innerHTML =
          '<h3>'+titleHtml+'</h3>'+
          '<div class="meta"><span class="tag">'+escapeHtml(label)+'</span>'+
          '<span class="src">'+escapeHtml(it.date||'')+'　·　'+escapeHtml(it.source||'')+'</span></div>'+
          '<p class="summary">'+escapeHtml(it.summary||'')+'</p>';
        list.appendChild(card);
      });
    }

    function escapeHtml(s){
      return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    renderRegionTabs();
    renderBody();
  }

  // 在线打开时拉取最新 data.json（绕过缓存，确保“打开即最新”）；本地双击若被浏览器拦截则回退内嵌数据
  fetch('./data.json?t=' + Date.now(), {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('bad'); return r.json(); })
    .then(d=>boot(d))
    .catch(()=>boot(NEWS_DATA));
})();
</script>
</body>
</html>
