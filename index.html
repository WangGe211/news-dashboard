    let activeKey = tabs[0].key;

    function renderRegionTabs(){
      regionTabs.innerHTML = '';
      tabs.forEach(t=>{
        const el = document.createElement('div');
        el.className = 'tab' + (t.key===activeKey?' active':'');
        el.innerHTML = t.name + '<span class="en">'+t.en+'</span>';
        el.onclick = ()=>{ activeKey = t.key; renderRegionTabs(); renderBody(); };
        regionTabs.appendChild(el);
      });
    }

    function renderBody(){
      const isIntl = activeKey === '__intl';
      subTabs.innerHTML = '';
      if(isIntl){
        subTabs.className = 'subtabs';
        renderList(intl, '国际热点', '');
        return;
      }
      subTabs.className = 'subtabs show';
      const region = regions.find(r=>r.key===activeKey);
      let subs;
      if(region.subs && region.subs.length){  // 安全生产等栏目：使用自定义子栏目（如 国家/四川/绵阳/盐亭 层面）
        subs = region.subs.map(s=>({key:s.key, label:s.label, items:s.items||[], note:s.note||''}));
      } else {
        subs = [];
        if(region.key !== 'aba'){  // 阿坝州已设“反腐被查”独立栏目，不再单列“阳光阿坝”官方动态
          subs.push({key:'official', label:region.officialLabel || '官方动态', items:region.official, note:''});
        }
        subs.push(
          {key:'appointments', label:'干部任免', items:region.appointments, note:''},
          {key:'antiCorruption', label:'反腐被查', items:region.antiCorruption || [], note:region.acNote || ''},
          {key:'hot', label:'热点信息', items:region.hot, note:''}
        );
      }
      let activeSub = subs[0].key;
      subs.forEach(s=>{
        const el = document.createElement('div');
        el.className = 'subtab' + (s.key===activeSub?' active':'');
        el.textContent = s.label + ' ('+ (s.items? s.items.length:0) +')';
        el.onclick = ()=>{
          [...subTabs.children].forEach(c=>c.className='subtab');
          el.className='subtab active';
          renderList(s.items, s.label, s.note);
        };
        subTabs.appendChild(el);
      });
      renderList(subs[0].items, subs[0].label, subs[0].note);
    }

    function renderList(items, label, note){
      list.innerHTML = '';
      const arr = (items||[]).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||'')); // 时间从近到远
      metaRow.innerHTML = '当前栏目：' + escapeHtml(label) + '　共 ' + arr.length + ' 条'
        + (note ? '　<span class="acnote">权威发布：' + escapeHtml(note) + '</span>' : '');
      if(arr.length===0){
        list.innerHTML = '<div class="empty">暂无资讯</div>';
        return;
      }
      arr.forEach(it=>{
        const card = document.createElement('div');
        card.className = 'card';
        const titleHtml = it.url
          ? '<a href="'+it.url+'" target="_blank" rel="noopener">'+escapeHtml(it.title)+'</a>'
          : escapeHtml(it.title);
        card.innerHTML =
          '<h3>'+titleHtml+'</h3>'+
          '<div class="meta"><span class="tag">'+escapeHtml(label)+'</span>'+
          '<span class="src">'+escapeHtml(it.date||'')+'　·　'+escapeHtml(it.source||'')+'</span></div>'+
          '<p class="summary">'+escapeHtml(it.summary||'')+'</p>';
        list.appendChild(card);
      });
    }

    function escapeHtml(s){
      return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    renderRegionTabs();
    renderBody();
  }

  // 在线打开时拉取最新 data.json（绕过缓存，确保“打开即最新”）；本地双击若被浏览器拦截则回退内嵌数据
  fetch('./data.json?t=' + Date.now(), {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('bad'); return r.json(); })
    .then(d=>boot(d))
    .catch(()=>boot(NEWS_DATA));
})();
</script>
</body>
</html>
